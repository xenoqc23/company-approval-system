{% if user.is_authenticated %}<div class="integrated-test-tools"><span>사내결재 통합 로컬 테스트 · 가상 직원</span><form method="post" action="{% url 'purchasing:switch' %}">{% csrf_token %}<label for="integrated-role">역할 전환</label><select name="user" id="integrated-role">{% regroup demo_accounts by test_group as groups %}{% for group in groups %}<optgroup label="{{ group.grouper }}">{% for account in group.list %}<option value="{{ account.user_id }}" {% if user.pk == account.user_id %}selected{% endif %}>{{ account.label }}</option>{% endfor %}</optgroup>{% endfor %}</select><button class="btn secondary small">전환</button></form></div>{% endif %}
