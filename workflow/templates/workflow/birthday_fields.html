<div class="birthday-fields">{% for field in birthday_form %}<div class="field{% if field.name == 'birthday_lunar_leap' %} birthday-leap-field{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <em>*</em>{% endif %}</label>{{ field }}{{ field.errors }}</div>{% endfor %}</div><p class="muted birthday-help">양력·음력 생일의 월·일만 입력합니다. 음력 윤달에 태어난 경우에만 윤달을 선택하세요. 월·일을 모두 비우고 저장하면 미등록으로 변경됩니다.</p>
