{% extends 'workflow/base.html' %}{% block content %}<section class="auth-single narrow"><span class="quick-icon green"><svg><use href="#i-shield"/></svg></span><div class="eyebrow">ACCOUNT SECURITY</div><h1>비밀번호 변경</h1><p class="muted">초기·임시 비밀번호를 변경하고 업무를 시작하세요.</p><form method="post">{% csrf_token %}{% for field in form %}<div class="field"><label>{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<p class="form-footnote">숫자로만 이루어지지 않은 8자 이상의 비밀번호를 입력해 주세요.</p><button class="btn full-width">변경하고 시작하기</button></form><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="logout">로그아웃</button></form></section>{% endblock %}
