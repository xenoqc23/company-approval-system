{% extends 'workflow/base.html' %}{% block content %}<section class="auth-single"><a class="brand dark-brand" href="{% url 'login' %}"><span class="brand-icon"><svg><use href="#i-file"/></svg></span><span>사내결재<small>WORKSPACE</small></span></a><div class="eyebrow">JOIN WORKSPACE</div><h1>직원 가입 신청</h1><p class="muted">관리자가 확인·승인한 뒤 사용할 수 있습니다.</p><form method="post">{% csrf_token %}{{ form.non_field_errors }}<div class="field-grid">{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }} <em>*</em></label>{{ field }}{{ field.errors }}</div>{% endfor %}</div><p class="form-footnote">비밀번호는 4자 이상 입력해 주세요. 숫자만 사용해도 됩니다.</p><button class="btn full-width">가입 신청</button></form><a class="text-link" href="{% url 'login' %}">로그인으로 돌아가기</a></section>{% endblock %}
